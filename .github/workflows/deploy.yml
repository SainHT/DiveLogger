name: Deploy DiveLogger Web to GitHub Pages

on:
  push:
    branches:
      - main  # Deploy only when pushing to the main branch
  pull_request:
    branches:
      - main  # Deploy only when creating a pull request to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]  # Specify the Node.js version

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the React app
      - name: Build React App
        run: npm run build --if-present
      
      # Step 5: Run tests (optional)
      # - name: Run Tests
      #   run: npm test

      # Step 6: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}